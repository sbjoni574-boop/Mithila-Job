<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऑफ़लाइन — Mithila Job</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #C0392B);
    font-family: 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .icon {
    width: 84px; height: 84px; margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { opacity: 0.85; line-height: 1.6; margin: 0 0 22px; }
  button {
    background: #F1C40F; color: #1a1a2e; border: none;
    padding: 12px 28px; border-radius: 999px; font-weight: 700;
    font-size: 15px; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>इंटरनेट कनेक्शन नहीं है</h1>
    <p>ऐसा लगता है आप ऑफ़लाइन हैं। कृपया अपना इंटरनेट कनेक्शन जांचें और फिर से कोशिश करें। Mithila Job के कुछ हिस्से पहले से देखी गई जानकारी के साथ काम कर सकते हैं।</p>
    <button onclick="window.location.href='./index.html'">फिर से कोशिश करें</button>
  </div>
</body>
</html>
